[workspace]
resolver = "2"
members = [
    "crates/chainio",
    "crates/config",
    "crates/bidder",
    "crates/heartbeat",
    "crates/lifecycle",
    "crates/executor",
    "crates/supervision",
    "crates/node-agent",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/CitrateNetwork/citrate-node-agent"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiny-keccak = { version = "2", features = ["keccak"] }
