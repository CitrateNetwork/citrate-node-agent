[workspace]
resolver = "2"
members = [
    "crates/chainio",
    "crates/config",
    "crates/bidder",
    "crates/heartbeat",
    "crates/lifecycle",
    "crates/executor",
    "crates/earnings",
    "crates/pinning",
    "crates/supervision",
    "crates/node-agent",
]

[workspace.package]
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/CitrateNetwork/citrate-node-agent"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiny-keccak = { version = "2", features = ["keccak"] }
# SECREM-01 SVC-2 (pre-audit 2026-06-09): local sha-256 recomputation of fetched
# model weights — integrity must come from local recomputation, never the transport.
sha2 = { version = "0.10", default-features = false }
