name: address-drift

# Blocking CL-C2 gate: fails CI if this repo's vendored 40204 address book drifts
# from the canonical citrate-chain source of truth. After a re-roll, this goes red
# until the repo re-syncs — the control that was missing when the 2026-07-27 reroll
# silently shipped dead addresses across the federation.
#
# Requires the org secret CITRATE_CHAIN_READ_TOKEN: a read-only token with access to
# CitrateNetwork/citrate-chain (already used by citrate-core CI). Once
# @citratelabs/chain-config is published, this can be simplified to
# `npx @citratelabs/chain-config check <file>` with no cross-repo checkout.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/chainio/src/generated/addresses.json'
      - '.github/workflows/address-drift.yml'

permissions:
  contents: read

concurrency:
  group: address-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    # Internal-only gate (checks the vendored 40204 address book against the canonical set in the
    # PRIVATE citrate-chain). Skips on public/fork CI (no token) so public CI never checks out a
    # private repo; runs authoritatively on internal pushes once CITRATE_CHAIN_READ_TOKEN is set.
    env:
      CHAIN_TOKEN: ${{ secrets.CITRATE_CHAIN_READ_TOKEN }}
    steps:
      - name: Skipped on public/fork CI (no chain read token)
        if: env.CHAIN_TOKEN == ''
        run: echo "address-drift is an internal supply-chain gate; skipped without CITRATE_CHAIN_READ_TOKEN."
      - name: Checkout this repo
        if: env.CHAIN_TOKEN != ''
        uses: actions/checkout@v4
        with:
          path: consumer
      - name: Checkout canonical citrate-chain (sparse)
        if: env.CHAIN_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: CitrateNetwork/citrate-chain
          ref: main
          token: ${{ secrets.CITRATE_CHAIN_READ_TOKEN }}
          path: citrate-chain
          sparse-checkout: |
            contracts/addresses
            packages/chain-config
      - uses: actions/setup-node@v4
        if: env.CHAIN_TOKEN != ''
        with:
          node-version: '20'
      - name: Address drift check (blocking)
        if: env.CHAIN_TOKEN != ''
        run: |
          node citrate-chain/packages/chain-config/bin/check.mjs \
            check "consumer/crates/chainio/src/generated/addresses.json" \
            --canonical citrate-chain/contracts/addresses/40204.json
