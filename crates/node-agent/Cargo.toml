[package]
name = "node-agent"
version = "0.1.0"
description = "Citrate node agent binary — ties compute.json config to the cost-plus bidder and chain reads (SELL-S1)."
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "node-agent"
path = "src/main.rs"

[dependencies]
chainio = { path = "../chainio" }
config = { path = "../config" }
bidder = { path = "../bidder" }
heartbeat = { path = "../heartbeat" }
lifecycle = { path = "../lifecycle" }
executor = { path = "../executor" }
earnings = { path = "../earnings" }
supervision = { path = "../supervision" }
tokio.workspace = true
# NA-B-008/NA-01: per-job commitment nonces, minted from the vetted OS CSPRNG
# (already in the tree via supervision) and persisted so a restart reuses them.
getrandom = "0.2"

[dev-dependencies]
# Virtual-time test clock for the daemon loop cadence tests.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "test-util"] }
