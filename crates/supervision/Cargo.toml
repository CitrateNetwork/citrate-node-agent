[package]
name = "supervision"
version = "0.1.0"
description = "Local HTTP supervision surface (/health /status /pause /resume) + the agent state machine the GUI drives (SELL-S1)."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json"] }
# Per-instance bearer token for the supervision surface (FUA-NODE-AGENT-01/02):
# getrandom for the CSPRNG token, subtle for the constant-time compare.
getrandom = "0.2"
subtle = "2"
# NA-B-007: O_NOFOLLOW + geteuid() so the token file is never adopted through a
# symlink or from a foreign-owned inode (already in the tree via getrandom).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# A tiny HTTP client to exercise the live server over an ephemeral TCP port in
# integration tests (no chain, no keys). reqwest is already vendored offline.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net"] }
