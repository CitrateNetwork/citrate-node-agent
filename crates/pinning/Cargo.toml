[package]
name = "pinning"
version = "0.1.0"
description = "PIN-S6 pinning daemon core: the pin-lifecycle planner (seal → challenge → prove → claim → return-bond) over IPFSIncentives state, the no-keys signing seam, and the Sealer interface. The daemon holds no keys (ADR-agent-signing); each write becomes an UNSIGNED request for the relay."
edition.workspace = true
license.workspace = true
repository.workspace = true

# Pure decision logic over chainio's decoded pin/slot state + calldata builders,
# plus the async `PinSigner` seam (a relay/gui-native surface implements it; the
# default `RecordingPinSigner` records requests so the planner is fully
# offline-testable) and the `Sealer` seam (the real reduced-circuit prover is a
# sidecar — see lib.rs; the test `FakeSealer` is behind cfg(test)). tokio is
# dev-only, for the async-signer/sealer tests.
[dependencies]
chainio = { path = "../chainio" }

[dev-dependencies]
tokio = { workspace = true }
