[package]
name = "pinning"
version = "0.1.0"
description = "PIN-S6 pinning daemon core: the pin-lifecycle planner (seal → challenge → prove → claim → return-bond) over IPFSIncentives state, the no-keys signing seam, and the Sealer interface. The daemon holds no keys (ADR-agent-signing); each write becomes an UNSIGNED request for the relay."
edition.workspace = true
license.workspace = true
repository.workspace = true

# Pure decision logic over chainio's decoded pin/slot state + calldata builders,
# plus the async `PinSigner` seam, the `Sealer` seam, and the `SidecarSealer`
# adapter that drives the out-of-process `citrate-sealer` binary over its JSON
# protocol (tokio::process), and the `runloop` that wires planner+sealer+signer.
[dependencies]
chainio = { path = "../chainio" }
tokio = { workspace = true, features = ["process", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
hex = "0.4"
tiny-keccak = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
